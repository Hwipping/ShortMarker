<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShortMarker Options</title>
    <link rel="stylesheet" href="src/options.css">
  </head>
  <body>
    <main>
      <h1>ShortMarker</h1>
      <p>Set the custom URL opened by the custom shortcut command.</p>

      <form id="options-form">
        <label for="custom-url">Custom URL</label>
        <input id="custom-url" name="custom-url" type="url" placeholder="https://example.com" autocomplete="url">
        <button type="submit">Save</button>
      </form>

      <p id="status" role="status"></p>
    </main>

    <script type="module" src="src/options.js"></script>
  </body>
</html>
